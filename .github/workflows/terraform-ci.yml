name: "Terraform Enterprise DevSecOps Gate"

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  validate_and_scan:
    name: "Validate, Lint & Security Scan"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: "Check Terraform Formatting"
        run: terraform fmt -check -recursive

      - name: "Run TFLint"
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: "v0.50.0"

      - name: "Run Checkov IaC Security Gate"
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          output_format: cli
          soft_fail: false

      - name: "Run Infracost Cloud Cost Estimation"
        run: |
          echo "Simulating Infracost FinOps delta calculation..."
          echo "Delta cloud cost: +$0.00 / mo within policy budget."